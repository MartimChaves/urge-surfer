name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: docker compose build dev prod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tool/check_no_network.sh
      - run: node --test test/
      - run: pip install pillow
      - run: python -m unittest tool.test_glyphdata
