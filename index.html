<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750a4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141018" media="(prefers-color-scheme: dark)">
<title>Urge Surfer</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/main.js"></script>
</head>
<body>

<main>
  <section id="ledger" class="screen">
    <h1>Urge Surfer</h1>
    <p class="count" id="wave-count">0</p>
    <p class="muted" id="wave-label">waves surfed</p>
    <button class="primary" data-go="#/ritual">Start a wave</button>
    <button class="link" data-go="#/write">Just write</button>
  </section>

  <section id="ritual" class="screen" hidden>
    <button class="back" data-go="#/" aria-label="Back">&larr;</button>

    <div class="step">
      <h2>What do you want to do right now?</h2>
      <textarea id="urge-text" rows="3" autocomplete="off"></textarea>
      <button class="primary" id="urge-next">Next</button>
    </div>

    <div class="step" hidden>
      <h2>How strong is the urge right now?</h2>
      <output class="count">5</output>
      <input type="range" min="0" max="10" step="1" value="5" id="urge-before">
      <button class="primary">Next</button>
    </div>

    <div class="step" hidden>
      <div class="tracer-host"></div>
    </div>

    <div class="step" hidden>
      <h2>How strong is the urge now?</h2>
      <output class="count">5</output>
      <input type="range" min="0" max="10" step="1" value="5" id="urge-after">
      <button class="primary">Log wave</button>
    </div>
  </section>

  <section id="write" class="screen" hidden>
    <button class="back" data-go="#/" aria-label="Back">&larr;</button>
    <h2>Just write</h2>
    <ul id="phrase-list" class="phrases"></ul>
    <div class="tracer-host" hidden></div>
  </section>
</main>

<template id="tracer-template">
  <p class="phrase"></p>
  <canvas></canvas>
  <label class="lag"><input type="checkbox" checked> pen lag</label>
</template>

</body>
</html>
