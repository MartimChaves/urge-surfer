services:
  dev:
    build:
      context: .
      target: development
    environment:
      SITE_ADDRESS: http://localhost
    ports:
      - "80:80"
    volumes:
      - ./index.html:/srv/urge-surfer/public/index.html:ro
      - ./styles.css:/srv/urge-surfer/public/styles.css:ro
      - ./src:/srv/urge-surfer/public/src:ro
      - ./assets:/srv/urge-surfer/public/assets:ro

  prod:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-urgesurfer.surf}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
